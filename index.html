<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chenjela - Zambia's #1 Study Hub</title>
    <style>
        :root { --gold: #f5b400; --dark-bg: #0a0f1e; --card-bg: #1a2b4a; }
        body { margin: 0; font-family: sans-serif; background: var(--dark-bg); color: white; padding: 10px; line-height: 1.6; }
        
        /* HEADER */
        header { text-align: center; padding: 20px 10px; border-bottom: 2px solid var(--gold); margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: bold; color: var(--gold); margin: 0; }
        
        /* CARDS */
        .chenjela-card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #2a3e5a; }
        h2, h3 { color: var(--gold); margin-top: 0; }

        /* INPUTS & BUTTONS */
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #415a77; background: #0d1b2a; color: white; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; margin-top: 10px; border-radius: 8px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn-primary { background: var(--gold); color: var(--dark-bg); }
        .btn-whatsapp { background: #25D366; color: white; }

        /* PRICING STACK */
        .tier { border: 1px solid #415a77; padding: 15px; border-radius: 10px; margin-top: 15px; background: rgba(255,255,255,0.05); }
        .price { font-size: 24px; font-weight: bold; color: #4ade80; }
    </style>
</head>
<body>

    <header>
        <p class="logo">Chenjela.</p>
        <small>Zambian CBC & O-Level Hub</small>
    </header>

    <div class="chenjela-card">
        <h3>Ask Teacher Chenjela</h3>
        <input type="text" id="userInput" placeholder="Ask about Math, Science, or CBC...">
        <button class="btn-primary" onclick="alert('Sending to AI...')">Send Question</button>
    </div>

    <div class="chenjela-card">
        <h3>Teacher's Grid</h3>
        <p>Generate CBC Schemes of Work instantly.</p>
        <input type="text" id="topicInput" placeholder="Topic (e.g. Integers Form 1)">
        <button class="btn-primary" style="background: #3a86ff; color: white;">Generate Grid</button>
    </div>

    <div class="chenjela-card">
        <h3>Choose Your Plan</h3>
        
        <div class="tier">
            <strong>Basic</strong>
            <p class="price">K0</p>
            <small>5 Questions/Day • Old Syllabus</small>
        </div>

        <div class="tier" style="border-color: var(--gold);">
            <strong>Premium</strong>
            <p class="price">K150/mo</p>
            <small>Unlimited AI • CBC Grids • Parent Reports</small>
            <a href="https://wa.me/260971234567?text=Hi!%20I%20want%20to%20activate%20Chenjela%20Premium" style="text-decoration:none;">
                <button class="btn-whatsapp">Pay via Mobile Money</button>
            </a>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
