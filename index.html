<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chenjela AI 🇿🇲</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #003366; color: white; font-family: sans-serif; text-align: center; padding: 20px;">

    <h1 style="color: #FFD700;">Teacher Chenjela</h1>
    <p>Zambian CBC Syllabus Assistant</p>

    <div id="chat-container" style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; min-height: 200px; margin-bottom: 20px;">
        <div id="responseArea">Ask Teacher Chenjela anything about lesson plans or the syllabus...</div>
    </div>

    <input type="text" id="userInput" placeholder="e.g. Grade 10 Math lesson plan..." style="width: 80%; padding: 10px; border-radius: 5px; border: none;">
    <br><br>
    <button onclick="askAI()" style="background: #FFD700; color: #003366; padding: 15px 30px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Send Question</button>

    <div style="text-align: center; font-size: 10px; color: #ccc; margin-top: 40px; padding: 10px; border-top: 1px solid #555;">
        <p>© 2026 Chenjela Education Hub. <br>
        Developed in Zambia. Payments are non-refundable.</p>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
